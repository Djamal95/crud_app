services:
  app:
    build: .
    image: crud_app-app
    container_name: crud_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel
      DB_PASSWORD: toor
    networks:
      - app_net

  db:
    image: mysql:8.0
    container_name: crud_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: toor
      MYSQL_ROOT_PASSWORD: toor
    volumes:
      - dbdata:/var/lib/mysql
    # Pas besoin d'exposer 3306 en CI
    # ports:
    #   - "3306:3306"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ptoor | grep 'mysqld is alive'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

volumes:
  dbdata:

networks:
  app_net:
    driver: bridge
